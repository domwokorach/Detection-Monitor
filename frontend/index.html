<!doctype html>
<html lang="en-GB" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#020D1B" />
    <title>Detection-monitor — AML Command Center</title>
    <script>
      // Apply the saved theme before first paint (dark by default) to avoid a flash.
      (function () {
        var m = 'dark';
        try { var s = localStorage.getItem('detection-monitor.theme'); if (s === 'light' || s === 'dark' || s === 'system') m = s; } catch (e) {}
        var t = m === 'system' ? (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark') : m;
        document.documentElement.classList.toggle('dark', t === 'dark');
        document.documentElement.style.colorScheme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
